<title>Fiesta de 18</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Comic+Neue:wght@400;700&family=Permanent+Marker&display=swap">
<style>
  :root {
    --bg: #1a0a2e;
    --bg-card: #2a1248;
    --pink: #FF2D95;
    --cyan: #00F0FF;
    --lime: #39FF14;
    --yellow: #FFE500;
    --magenta: #FF00FF;
    --orange: #FF6B00;
    --text: #fff;
    --text-muted: #c9a0ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Comic Neue', 'Comic Sans MS', cursive;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ---- Intro screen ---- */
  .intro {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    padding: 2rem 1rem;
    max-width: 500px;
    text-align: center;
  }
  .intro.hidden { display: none; }

  .intro-title {
    font-family: 'Bungee Shade', cursive;
    font-size: clamp(1.8rem, 7vw, 3rem);
    background: linear-gradient(135deg, var(--pink), var(--yellow), var(--cyan), var(--magenta));
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: grad 3s ease infinite;
    text-wrap: balance;
  }
  @keyframes grad {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .intro-sub {
    font-family: 'Permanent Marker', cursive;
    font-size: 1.1rem;
    color: var(--text-muted);
  }

  .upload-area {
    width: 260px;
    height: 260px;
    border: 3px dashed var(--pink);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.3s, box-shadow 0.3s;
    overflow: hidden;
    position: relative;
  }
  .upload-area:hover {
    border-color: var(--cyan);
    box-shadow: 0 0 30px rgba(0,240,255,0.3);
  }
  .upload-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }
  .upload-area .upload-prompt {
    font-family: 'Permanent Marker', cursive;
    font-size: 1rem;
    color: var(--pink);
    text-align: center;
    padding: 1rem;
    line-height: 1.5;
  }
  .upload-area.has-image .upload-prompt { display: none; }
  .upload-area.has-image img { display: block; }
  .upload-area.has-image { border-style: solid; border-color: var(--magenta); }
  input[type="file"] { display: none; }

  .play-btn {
    font-family: 'Bungee Shade', cursive;
    font-size: 1.3rem;
    padding: 0.8rem 2.5rem;
    border: none;
    border-radius: 99px;
    background: linear-gradient(135deg, var(--pink), var(--magenta));
    color: #fff;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255,45,149,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
    opacity: 0.3;
    pointer-events: none;
  }
  .play-btn.ready {
    opacity: 1;
    pointer-events: auto;
  }
  .play-btn.ready:hover {
    transform: scale(1.05);
    box-shadow: 0 0 35px rgba(255,45,149,0.6);
  }

  /* ---- Player screen ---- */
  .player {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    padding: 2rem 1rem;
    max-width: 500px;
    text-align: center;
  }
  .player.active { display: flex; }

  .photo-frame {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    overflow: hidden;
    border: 4px solid var(--magenta);
    box-shadow: 0 0 30px rgba(255,0,255,0.4);
    position: relative;
  }
  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform-origin: center center;
  }

  /* mouth overlay drawn via canvas */
  .photo-frame canvas {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 50%;
    pointer-events: none;
  }

  .now-playing {
    font-family: 'Permanent Marker', cursive;
    color: var(--yellow);
    font-size: 1rem;
    text-shadow: 0 0 8px var(--yellow);
    animation: pulse-np 1.5s ease-in-out infinite alternate;
  }
  @keyframes pulse-np {
    0% { opacity: 0.6; }
    100% { opacity: 1; }
  }

  .speaker-label {
    font-family: 'Comic Neue', cursive;
    font-weight: 700;
    font-size: 1.6rem;
    color: var(--cyan);
    text-shadow: 0 0 10px var(--cyan);
  }

  .lyrics-crawl {
    font-style: italic;
    color: var(--text-muted);
    font-size: 1.1rem;
    min-height: 2.5em;
    line-height: 1.4;
    max-width: 380px;
  }

  /* shockwave rings */
  .shockwave {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 2px solid var(--pink);
    top: 0; left: 0;
    opacity: 0;
    pointer-events: none;
  }

  @keyframes ring {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(1.8); opacity: 0; }
  }

  /* ---- Enter party button ---- */
  .enter-btn {
    display: none;
    font-family: 'Bungee Shade', cursive;
    font-size: clamp(1rem, 4vw, 1.5rem);
    padding: 1rem 2.5rem;
    border: none;
    border-radius: 99px;
    background: linear-gradient(135deg, var(--lime), var(--cyan));
    color: #1a0a2e;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(57,255,20,0.4);
    animation: enter-pulse 1.5s ease-in-out infinite alternate;
    text-decoration: none;
  }
  .enter-btn.show { display: inline-block; }
  @keyframes enter-pulse {
    0% { box-shadow: 0 0 25px rgba(57,255,20,0.4); transform: scale(1); }
    100% { box-shadow: 0 0 45px rgba(57,255,20,0.7); transform: scale(1.04); }
  }
  .enter-btn:hover { filter: brightness(1.1); }

  /* ---- bars visualizer ---- */
  .visualizer {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 60px;
    margin-top: 0.5rem;
  }
  .viz-bar {
    width: 6px;
    background: var(--pink);
    border-radius: 3px;
    transition: height 0.08s ease;
    min-height: 3px;
  }
  .viz-bar:nth-child(even) { background: var(--cyan); }
  .viz-bar:nth-child(3n) { background: var(--lime); }
  .viz-bar:nth-child(4n+1) { background: var(--yellow); }

  /* sparkle bg */
  canvas#bg-sparkles {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: -1;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>

<canvas id="bg-sparkles"></canvas>

<!-- Intro: pick your photo -->
<div class="intro" id="introScreen">
  <div class="intro-title">Antes de entrar...</div>
  <div class="intro-sub">Sube la foto de la cumpleanera</div>
  <div class="upload-area" id="uploadArea">
    <span class="upload-prompt">Toca aqui para subir la foto</span>
    <img id="previewImg" alt="">
  </div>
  <input type="file" id="fileInput" accept="image/*">
  <button class="play-btn" id="playBtn">DALE PLAY</button>
</div>

<!-- Player: lip-sync show -->
<div class="player" id="playerScreen">
  <div class="now-playing">REPRODUCIENDO...</div>
  <div class="speaker-label">Mensaje especial de Alfredo Adame</div>
  <div style="position:relative; display:inline-block;">
    <div class="photo-frame" id="photoFrame">
      <img id="playerImg" alt="">
    </div>
    <div class="shockwave" id="shock1"></div>
    <div class="shockwave" id="shock2"></div>
    <div class="shockwave" id="shock3"></div>
  </div>
  <div class="visualizer" id="visualizer"></div>
  <div class="lyrics-crawl" id="lyrics"></div>
  <button class="enter-btn" id="enterBtn" onclick="window.location.href=INVITE_URL">ENTRAR A LA FIESTA</button>
</div>

<audio id="adameAudio" preload="auto"></audio>

  uploadArea.addEventListener('click', function() { fileInput.click(); });

  fileInput.addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      imageDataURL = ev.target.result;
      previewImg.src = imageDataURL;
      uploadArea.classList.add('has-image');
      playBtn.classList.add('ready');
    };
    reader.readAsDataURL(file);
  });

  playBtn.addEventListener('click', function() {
    if (!imageDataURL) return;
    playerImg.src = imageDataURL;
    introScreen.classList.add('hidden');
    playerScreen.classList.add('active');
    startShow();
  });

  function startShow() {
    var actx = new (window.AudioContext || window.webkitAudioContext)();
    var analyser = actx.createAnalyser();
    analyser.fftSize = 128;
    var source = actx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(actx.destination);

    var bufLen = analyser.frequencyBinCount;
    var dataArr = new Uint8Array(bufLen);

    var img = document.getElementById('playerImg');
    var shock1 = document.getElementById('shock1');
    var shock2 = document.getElementById('shock2');
    var shock3 = document.getElementById('shock3');
    var lastRing = 0;
    var ringIdx = 0;
    var shocks = [shock1, shock2, shock3];

    audio.play();

    function animate() {
      analyser.getByteFrequencyData(dataArr);

      // Average volume
      var sum = 0;
      for (var i = 0; i < bufLen; i++) sum += dataArr[i];
      var avg = sum / bufLen;
      var norm = avg / 255;

      // Photo "lip sync" — scale + slight rotation based on volume
      var sc = 1 + norm * 0.12;
      var rot = (norm > 0.3) ? (Math.sin(Date.now() * 0.015) * norm * 5) : 0;
      var skewX = norm > 0.4 ? Math.sin(Date.now() * 0.02) * norm * 3 : 0;
      img.style.transform = 'scale(' + sc + ') rotate(' + rot + 'deg) skewX(' + skewX + 'deg)';

      // Frame glow
      var glowSize = 30 + norm * 50;
      var hue = (Date.now() * 0.1) % 360;
      photoFrame.style.boxShadow = '0 0 ' + glowSize + 'px hsla(' + hue + ',100%,60%,0.5)';
      photoFrame.style.borderColor = 'hsla(' + hue + ',100%,60%,1)';

      // Shockwave rings on loud parts
      var now = Date.now();
      if (norm > 0.5 && now - lastRing > 400) {
        var s = shocks[ringIdx % 3];
        s.style.animation = 'none';
        void s.offsetWidth;
        s.style.borderColor = 'hsla(' + hue + ',100%,60%,1)';
        s.style.animation = 'ring 0.8s ease-out forwards';
        ringIdx++;
        lastRing = now;
      }

      // Visualizer bars
      var step = Math.floor(bufLen / NUM_BARS);
      for (var i = 0; i < NUM_BARS; i++) {
        var val = dataArr[i * step] || 0;
        var h = Math.max(3, (val / 255) * 60);
        bars[i].style.height = h + 'px';
      }

      if (!audio.ended) {
        requestAnimationFrame(animate);
      } else {
        // Reset bars
        for (var i = 0; i < NUM_BARS; i++) bars[i].style.height = '3px';
        img.style.transform = 'scale(1)';
        photoFrame.style.boxShadow = '0 0 30px rgba(255,0,255,0.4)';
        photoFrame.style.borderColor = '#FF00FF';
        enterBtn.classList.add('show');
        lyricsEl.textContent = 'Ahora si... entra a la fiesta';
      }
    }
    animate();
  }

  // Background sparkles
  var c = document.getElementById('bg-sparkles');
  var cx = c.getContext('2d');
  var w, h;
  var pts = [];
  var cols = ['#FF2D95','#00F0FF','#39FF14','#FFE500','#FF00FF'];
  function resize() { w = c.width = innerWidth; h = c.height = innerHeight; }
  resize();
  addEventListener('resize', resize);
  for (var i = 0; i < 50; i++) pts.push({
    x: Math.random()*2000, y: Math.random()*2000,
    s: Math.random()*2+1, sp: Math.random()*0.3+0.1,
    col: cols[Math.floor(Math.random()*cols.length)],
    ph: Math.random()*Math.PI*2, tw: Math.random()*0.02+0.005
  });
  function drawBg() {
    cx.clearRect(0,0,w,h);
    for (var p of pts) {
      p.ph += p.tw;
      var fl = 0.4+0.6*Math.sin(p.ph);
      cx.globalAlpha = fl*0.5;
      cx.fillStyle = p.col;
      cx.beginPath();
      cx.arc(p.x%w, p.y%h, p.s*fl, 0, Math.PI*2);
      cx.fill();
      p.y -= p.sp;
      if (p.y < -5) { p.y = h+5; p.x = Math.random()*w; }
    }
    cx.globalAlpha = 1;
    requestAnimationFrame(drawBg);
  }
  drawBg();
})();
</script>
